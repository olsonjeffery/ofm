[workspace]
members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/olsonjeffery/ofm"

[package]
name = "ofm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["macros", "ws"] }
hiqlite = { version = "0.14", default-features = false, features = [
  "auto-heal",
  "sqlite",
  "toml",
  "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", features = ["fs"] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls",
  "stream",
  "query",
] }

# Provider abstraction & config merging
async-trait = "0.1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
tokio-stream = "0.1"

# Auth middleware (JWT verification, API key hashing, URL parsing)
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
sha2 = "0.11"
base64 = "0.23"
url = "2"
tower = "0.5"

# OAuth PKCE, session cookies, API key generation
rand = "0.10"
cookie = { version = "0.18", features = ["private"] }
hex = "0.4"
axum-extra = { version = "0.12", default-features = false, features = [
  "cookie",
  "cookie-private",
] }

# Leptos SSR webapp
leptos = { version = "0.8", features = ["ssr"] }
leptos_styling = { version = "0.3", features = ["ssr"] }

# Rauthy lifecycle & reverse proxy
bytes = "1"
http-body-util = "0.1"

# Precise process-group teardown of spawned subprocesses (kill(-pgid))
libc = "0.2"

# Markdown rendering (server-side)
pulldown-cmark = "0.13"

# HTML sanitization/escaping
ammonia = "4"
html-escape = "0.2"

# String similarity for echo detection
strsim = "0.11"

[dev-dependencies]
percent-encoding = "2"

[features]
ssr = ["leptos/ssr", "leptos_styling/ssr"]
